[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-radeon-rdna3"
version = "0.1.2"
description = "Run SGLang on AMD Radeon RDNA3 (gfx110x) GPUs — an out-of-tree plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "sglang-radeon-rdna3 contributors" }]
keywords = ["sglang", "rocm", "amd", "radeon", "rdna3", "gfx1100", "llm", "inference"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately empty. sglang, torch and ROCm must already be installed and are
# never pulled in here: resolving sglang's dependency tree on ROCm drags in
# CUDA wheels that replace the ROCm build of PyTorch. See docs/installation.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/AMD-AIM/sglang-radeon"
Issues = "https://github.com/AMD-AIM/sglang-radeon/issues"

[project.scripts]
sglang-rdna3 = "sglang_radeon_rdna3.cli:main"

# SGLang discovers this group in load_plugins() and calls register(). It runs
# in the engine process (entrypoints/engine.py) and in every scheduler
# subprocess (managers/scheduler.py), which is what makes the shims effective
# under tensor parallelism.
[project.entry-points."sglang.srt.plugins"]
radeon_rdna3 = "sglang_radeon_rdna3:register"

[tool.setuptools.packages.find]
where = ["src"]

