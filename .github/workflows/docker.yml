name: Build and publish image

# The image is large (a ROCm PyTorch base plus a compiled kernel), so this
# runs on tags and on demand rather than on every push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sglang_ref:
        description: SGLang git ref to build against
        default: main
      amdgpu_target:
        description: gfx target for the kernel
        default: gfx1100

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub runners are tight on space and the ROCm base image is ~18 GB.
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sglang-radeon
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SGLANG_REF=${{ inputs.sglang_ref || 'main' }}
            AMDGPU_TARGETS=${{ inputs.amdgpu_target || 'gfx1100' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Note
        run: |
          echo "::notice::Image published. The kernel is compiled for" \
               "${{ inputs.amdgpu_target || 'gfx1100' }}, but CI has no AMD GPU --" \
               "run 'sglang-rdna3 doctor' on real hardware to verify."
